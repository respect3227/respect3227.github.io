        <div class="meta">2026-08-05 · 网络 · 石定睿</div>

        <h2>排查思路：先定位 → 后排查 → 再解决</h2>

        <table>
            <tr><th>故障现象</th><th>排查步骤</th></tr>
            <tr><td>网页打不开</td><td>ping 网关 → ping 外网 → nslookup 测 DNS → 检查防火墙</td></tr>
            <tr><td>端口不通</td><td>netstat 看端口是否监听 → telnet 测试 → 检查防火墙规则</td></tr>
            <tr><td>IP 冲突</td><td>arp -a 查 MAC → 改 IP 或排查冲突设备</td></tr>
            <tr><td>间歇性断网</td><td>dmesg 看网卡日志 → 换网线/端口 → 查交换机日志</td></tr>
            <tr><td>服务无法访问</td><td>systemctl status → 看服务日志 → 检查端口是否被占用</td></tr>
        </table>
